<html lang="en">
<head>

<title>Pentra Forge</title>

<style>
/* ============================================================
   THEME TOKENS — dark (default) and light. Fully self-painted.
   Accent colors are injected at runtime from user settings.
   ============================================================ */
:root{
  --accent:#5b7cfa; --accent2:#22d3ee;
  --accent-ink:#ffffff;
  --good:#22c55e; --warn:#f5a524; --bad:#ef4444; --info:#38bdf8;
  --radius:14px; --radius-sm:10px;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --maxw:1180px;
}
html[data-theme="dark"]{
  --bg:#0e1116; --bg2:#0a0d12; --surface:#161b22; --surface2:#1d232c; --surface3:#252c37;
  --border:#2a323d; --border2:#39424f;
  --text:#e8ebf0; --muted:#9aa4b2; --faint:#6b7482;
  --grid:#232a34;
  --good-bg:rgba(34,197,94,.14); --warn-bg:rgba(245,165,36,.15); --bad-bg:rgba(239,68,68,.15);
}
html[data-theme="light"]{
  --bg:#f4f6fa; --bg2:#eef1f6; --surface:#ffffff; --surface2:#f6f8fc; --surface3:#eef2f8;
  --border:#e2e7ef; --border2:#d3dae6;
  --text:#141a22; --muted:#5a6473; --faint:#8b95a4;
  --grid:#e6ebf2;
  --good-bg:rgba(34,197,94,.14); --warn-bg:rgba(245,165,36,.16); --bad-bg:rgba(239,68,68,.12);
  --shadow:0 10px 26px rgba(30,45,80,.10);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
img{max-width:100%}
[hidden]{display:none!important}
button{font-family:inherit}
a{color:var(--accent)}
::selection{background:color-mix(in srgb,var(--accent) 40%,transparent)}

/* Accessibility: visible keyboard focus + respect reduced-motion */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
button:focus-visible,.chip:focus-visible,.nav a:focus-visible,.mobilenav a:focus-visible,.opt:focus-visible,.swatch:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}

/* Scrollbar */
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:var(--border2);border-radius:8px}
*::-webkit-scrollbar-track{background:transparent}

/* ---------- App shell ---------- */
#app{min-height:100vh}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;
  padding:max(12px,env(safe-area-inset-top,12px)) max(18px,env(safe-area-inset-right,18px)) 12px max(18px,env(safe-area-inset-left,18px));
  background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em;font-size:17px}
.brand .logo{width:30px;height:30px;border-radius:9px;flex:none;
  background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center}
.brand .logo svg{width:20px;height:20px}
.topbar .spacer{flex:1}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface);
  color:var(--text);cursor:pointer;display:grid;place-items:center}
.iconbtn:hover{background:var(--surface2);border-color:var(--border2)}
.iconbtn svg{width:19px;height:19px}
.greeting{font-size:13px;color:var(--muted)}
.greeting b{color:var(--text);font-weight:700}

.layout{display:flex;max-width:var(--maxw);margin:0 auto;gap:0}
.sidebar{width:210px;flex:none;padding:16px 10px;position:sticky;top:63px;align-self:flex-start;
  height:calc(100vh - 63px);overflow-y:auto}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:var(--muted);
  text-decoration:none;font-weight:600;font-size:14px;cursor:pointer;border:1px solid transparent}
.nav a svg{width:18px;height:18px;flex:none}
.nav a:hover{background:var(--surface);color:var(--text)}
.nav a.active{background:color-mix(in srgb,var(--accent) 16%,var(--surface));color:var(--text);
  border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.nav a.active svg{color:var(--accent)}
.content{flex:1;min-width:0;padding:22px 24px 90px}
.page-head{margin:0 0 18px}
.page-head h1{margin:0;font-size:26px;letter-spacing:-.02em;font-weight:800}
.page-head p{margin:4px 0 0;color:var(--muted);font-size:14px}

/* Mobile nav */
.mobilenav{display:none}
@media(max-width:820px){
  .sidebar{display:none}
  .content{padding:16px 14px 84px}
  .mobilenav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:45;
    background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(12px);
    border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));gap:2px}
  .mobilenav a{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:6px 2px;color:var(--muted);text-decoration:none;font-size:9.5px;font-weight:600;border-radius:8px;text-align:center}
  .mobilenav a span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mobilenav a svg{width:20px;height:20px}
  .mobilenav a.active{color:var(--accent)}
  .page-head h1{font-size:22px}
}

/* ---------- Cards & grid ---------- */
.grid{display:grid;gap:14px}
.cards{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.card h3{margin:0 0 2px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.card .sub{color:var(--faint);font-size:12px;margin-top:2px}
.metric{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-top:8px}
.metric small{font-size:15px;font-weight:600;color:var(--muted)}
.kpis{display:flex;flex-wrap:wrap;gap:18px;margin-top:10px}
.kpi{min-width:64px}
.kpi .n{font-size:22px;font-weight:800;letter-spacing:-.02em}
.kpi .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:1px}
.card.span2{grid-column:span 2}
@media(max-width:600px){.card.span2{grid-column:span 1}}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.mut{background:var(--surface2);color:var(--muted)}
.pill.acc{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}

.trend{font-size:13px;font-weight:700}
.trend.up{color:var(--good)} .trend.down{color:var(--bad)} .trend.flat{color:var(--muted)}

/* progress bar */
.bar{height:8px;border-radius:6px;background:var(--surface3);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}

/* ---------- Buttons & forms ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:11px;
  border:1px solid var(--border2);background:var(--surface2);color:var(--text);font-weight:700;font-size:14px;cursor:pointer}
.btn:hover{background:var(--surface3)}
.btn svg{width:17px;height:17px}
.btn.primary{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 70%,var(--accent2)));
  color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:var(--border)}
.btn.danger{background:var(--bad-bg);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:9px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}

label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:0 0 5px}
input,select,textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border2);
  background:var(--surface2);color:var(--text);font-size:14px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
textarea{resize:vertical;min-height:64px}
input[type=checkbox],input[type=radio]{width:auto}
input[type=color]{padding:3px;height:40px}
.field{margin-bottom:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:520px){.row,.row3{grid-template-columns:1fr}}
.inline-unit{display:flex;align-items:stretch;gap:0}
.inline-unit input{border-top-right-radius:0;border-bottom-right-radius:0}
.inline-unit .u{display:grid;place-items:center;padding:0 12px;border:1px solid var(--border2);border-left:0;
  border-radius:0 10px 10px 0;background:var(--surface3);color:var(--muted);font-weight:700;font-size:13px}
.hint{font-size:12px;color:var(--faint);margin-top:5px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}
.switch:last-child{border-bottom:0}
.switch .t{font-weight:600;font-size:14px}
.switch .d{font-size:12px;color:var(--muted)}
.toggle{position:relative;width:44px;height:26px;flex:none;cursor:pointer}
.toggle input{opacity:0;width:0;height:0}
.toggle .track{position:absolute;inset:0;background:var(--surface3);border:1px solid var(--border2);border-radius:999px;transition:.15s}
.toggle .track:before{content:"";position:absolute;left:3px;top:2px;width:20px;height:20px;border-radius:50%;background:var(--faint);transition:.15s}
.toggle input:checked+.track{background:color-mix(in srgb,var(--accent) 80%,transparent);border-color:transparent}
.toggle input:checked+.track:before{transform:translateX(18px);background:#fff}

/* ---------- Tables ---------- */
.tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:520px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;background:var(--surface2);position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty svg{width:42px;height:42px;opacity:.5;margin-bottom:10px}

/* section header */
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 12px}
.sec-head:first-child{margin-top:0}
.sec-head h2{margin:0;font-size:17px;font-weight:800;letter-spacing:-.01em}
.sec-head .sub{font-size:12.5px;color:var(--muted);font-weight:500}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;z-index:80;background:rgba(6,8,12,.6);backdrop-filter:blur(3px);
  display:grid;place-items:center;padding:18px;overflow-y:auto}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:18px;width:100%;max-width:520px;
  box-shadow:var(--shadow);max-height:92vh;display:flex;flex-direction:column;margin:auto}
.modal.wide{max-width:760px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-head h2{margin:0;font-size:18px;font-weight:800}
.modal-body{padding:18px 20px;overflow-y:auto}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}

/* ---------- Toast ---------- */
#toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
@media(max-width:820px){#toasts{bottom:76px}}
.toast{background:var(--surface3);color:var(--text);border:1px solid var(--border2);padding:11px 16px;border-radius:12px;
  font-weight:600;font-size:13.5px;box-shadow:var(--shadow);animation:tin .2s ease}
.toast.good{border-color:color-mix(in srgb,var(--good) 45%,transparent)}
.toast.bad{border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1}}

/* ---------- Setup wizard ---------- */
#setup{position:fixed;inset:0;z-index:120;background:var(--bg);display:flex;flex-direction:column}
.setup-inner{flex:1;overflow-y:auto;display:flex;justify-content:center;padding:24px 18px 0}
.setup-card{width:100%;max-width:540px}
.setup-logo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:8px;font-weight:800;font-size:18px}
.setup-logo .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center}
.setup-logo .logo svg{width:22px;height:22px}
.steps{display:flex;gap:6px;margin:18px 0 22px;justify-content:center;flex-wrap:wrap}
.steps i{width:26px;height:5px;border-radius:3px;background:var(--surface3)}
.steps i.on{background:var(--accent)}
.setup-card h2{font-size:24px;margin:0 0 4px;letter-spacing:-.02em}
.setup-card .lead{color:var(--muted);margin:0 0 20px}
.setup-foot{border-top:1px solid var(--border);padding:14px 18px;display:flex;justify-content:space-between;gap:12px;
  max-width:576px;margin:0 auto;width:100%}
.opts{display:grid;gap:10px}
.opt{padding:13px 15px;border:1px solid var(--border2);border-radius:12px;background:var(--surface2);cursor:pointer;font-weight:600;display:flex;align-items:center;gap:10px}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface2));box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:38px;height:38px;border-radius:10px;cursor:pointer;border:2px solid transparent;padding:0}
.swatch.sel{border-color:var(--text);box-shadow:0 0 0 2px var(--bg),0 0 0 4px currentColor}
.review-list{display:grid;gap:8px}
.review-list .r{display:flex;justify-content:space-between;gap:12px;padding:9px 12px;background:var(--surface2);border-radius:10px;font-size:14px}
.review-list .r b{font-weight:700}

/* charts */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--font)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}

.avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--surface3);flex:none;
  display:grid;place-items:center;font-weight:800;color:var(--accent);border:1px solid var(--border2)}
.setrow{display:grid;grid-template-columns:34px 1fr 1fr 1fr 34px;gap:8px;align-items:center;margin-bottom:8px}
.setrow .idx{text-align:center;color:var(--muted);font-weight:700;font-size:13px}
.setrow input{padding:9px 8px;text-align:center}
.setrow .del{background:var(--bad-bg);color:var(--bad);border:0;border-radius:8px;height:34px;cursor:pointer;font-size:16px;line-height:1}
.ex-block{border:1px solid var(--border);border-radius:12px;padding:13px;margin-bottom:12px;background:var(--surface)}
.ex-block .exh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.ex-block .exh .nm{font-weight:800}
.ex-block .exh .mu{font-size:11.5px;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:6px;background:var(--surface3);color:var(--muted);font-weight:600}
.divider{height:1px;background:var(--border);margin:18px 0}
.center{text-align:center}
.flexwrap{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 11px;border-radius:999px;border:1px solid var(--border2);background:var(--surface2);font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:color-mix(in srgb,var(--accent) 16%,var(--surface2));border-color:var(--accent);color:var(--text)}
</style>
<style id="neon">
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-600.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-700.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:800;font-display:swap;src:url(fonts/barlow-condensed-800.woff2) format('woff2')}
/* ===== Neon Iron (Oct 2026): dark-first restyle; the accent comes from the chosen theme preset ===== */
:root{ --display:"Barlow Condensed", var(--font); --glow:0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent), 0 10px 30px -6px color-mix(in srgb, var(--accent) 45%, transparent); }
:root[data-theme="dark"]{ --bg:#07080a; --bg2:#050607; --surface:#111418; --surface2:#171b20; --surface3:#1e242b; --border:#262d35; --border2:#333c46; --text:#f3f6f2; --muted:#9aa39a; --faint:#6b746b; --grid:#1c2229; --radius:18px; --radius-sm:12px; }
:root[data-theme="dark"] body{ background:radial-gradient(900px 420px at 50% -180px, color-mix(in srgb, var(--accent) 13%, transparent), transparent 70%), var(--bg); background-attachment:fixed; }
h1, h2, .page-head h1{ font-family:var(--display); font-weight:800; letter-spacing:.01em; }
.page-head h1{ text-transform:uppercase; line-height:1; }
.num{ font-family:var(--display); font-weight:700; font-variant-numeric:tabular-nums; }
:root[data-theme="dark"] .card{ background:linear-gradient(180deg, var(--surface2), var(--surface)); border:1px solid var(--border); border-radius:var(--radius); }
.btn{ border-radius:14px; }
.btn.primary{ background:var(--accent); color:var(--accent-ink); border-color:transparent; box-shadow:var(--glow); font-family:var(--display); font-weight:800; letter-spacing:.04em; text-transform:uppercase; }
@media (max-width:900px){ :root[data-theme="dark"] .mobilenav{ left:10px; right:10px; bottom:calc(10px + env(safe-area-inset-bottom)); border-radius:999px; border:1px solid var(--border); background:color-mix(in srgb, var(--surface) 84%, transparent); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); box-shadow:0 12px 30px rgba(0,0,0,.45); } .mobilenav a.active{ color:var(--accent); } }
/* live workout */
#live{ position:fixed; inset:0; z-index:60; display:flex; flex-direction:column; background:radial-gradient(700px 360px at 50% 0, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%), var(--bg); color:var(--text); padding:calc(10px + env(safe-area-inset-top)) 16px calc(14px + env(safe-area-inset-bottom)); overflow-y:auto; animation:lv-in .26s cubic-bezier(.2,.8,.2,1); }
#live .lv-wrap{ width:100%; max-width:560px; margin:0 auto; display:flex; flex-direction:column; min-height:100%; }
@keyframes lv-in{ from{ transform:translateY(24px); opacity:0 } to{ transform:none; opacity:1 } }
.lv-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
.lv-clock{ font-family:var(--display); font-weight:700; font-size:28px; color:var(--accent); font-variant-numeric:tabular-nums; }
.lv-ib{ min-width:48px; height:48px; border-radius:14px; border:1px solid var(--border); background:var(--surface); color:var(--text); display:grid; place-items:center; font-size:20px; cursor:pointer; }
.lv-ring{ width:54px; height:54px; position:relative; } .lv-ring svg{ transform:rotate(-90deg); display:block; } .lv-ring b{ position:absolute; inset:0; display:grid; place-items:center; font-family:var(--display); font-size:17px; }
.lv-ring circle.p{ transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1); }
.lv-name{ font-family:var(--display); font-weight:800; text-transform:uppercase; font-size:clamp(34px,11vw,64px); line-height:.95; text-align:center; margin:16px 0 6px; overflow-wrap:anywhere; }
.lv-last{ text-align:center; color:var(--muted); font-size:13px; min-height:18px; }
.lv-target{ text-align:center; font-family:var(--display); font-weight:700; color:var(--faint); font-size:clamp(26px,8vw,40px); margin:8px 0 12px; }
.lv-target em{ font-style:normal; color:var(--muted); font-size:.45em; letter-spacing:.14em; display:block; }
.lv-step{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:12px; }
.lv-st{ display:flex; align-items:center; justify-content:space-between; gap:6px; }
.lv-st button{ width:48px; height:48px; flex:none; border-radius:12px; border:0; background:var(--accent); color:var(--accent-ink); font-size:26px; font-weight:800; cursor:pointer; }
.lv-st label{ flex:1; text-align:center; } .lv-st input{ width:100%; max-width:84px; text-align:center; background:transparent; border:0; color:var(--text); font-family:var(--display); font-size:34px; font-weight:800; padding:0; }
.lv-st small{ display:block; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.08em; }
.lv-at{ color:var(--muted); font-family:var(--display); font-size:22px; }
.lv-chips{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:12px 0 4px; }
.lv-chip{ min-height:40px; padding:0 14px; border-radius:999px; border:1px solid var(--border2); background:var(--surface); color:var(--text); font-weight:600; cursor:pointer; }
.lv-chip[aria-pressed="true"]{ background:var(--accent); color:var(--accent-ink); border-color:transparent; }
.lv-drop{ display:block; margin:10px auto 12px; min-height:42px; padding:0 18px; border-radius:999px; border:1px dashed var(--border2); background:transparent; color:var(--text); font-weight:700; cursor:pointer; }
.lv-log{ width:100%; min-height:66px; border:0; border-radius:18px; background:var(--accent); color:var(--accent-ink); font-family:var(--display); font-weight:800; font-size:30px; letter-spacing:.06em; box-shadow:var(--glow); transition:transform .09s; cursor:pointer; }
.lv-log:active{ transform:scale(.96); }
.lv-done{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin:14px 0; }
.lv-done span{ padding:6px 10px; border-radius:10px; background:var(--surface2); font-size:13px; font-variant-numeric:tabular-nums; }
.lv-done span.pr{ background:color-mix(in srgb, #ff7a1a 24%, var(--surface2)); }
.lv-done span.wu{ opacity:.7; }
.lv-next{ margin-top:auto; display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%; min-height:60px; padding:10px 16px; border-radius:18px; border:1px solid var(--border); background:var(--surface); color:var(--text); text-align:left; cursor:pointer; }
.lv-next small{ display:block; color:var(--accent); font-family:var(--display); font-weight:700; letter-spacing:.1em; font-size:12px; }
.lv-next b{ font-family:var(--display); font-size:19px; text-transform:uppercase; }
.lv-rest{ position:fixed; inset:0; z-index:70; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:24px; background:radial-gradient(600px 400px at 50% 30%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%), rgba(5,6,7,.97); animation:lv-in .24s cubic-bezier(.2,.8,.2,1); }
.lv-rest .t{ font-family:var(--display); font-weight:800; font-size:clamp(96px,32vw,180px); color:var(--accent); line-height:.9; font-variant-numeric:tabular-nums; }
.lv-rest.ending .t{ animation:lv-pulse 1s ease-in-out infinite; }
@keyframes lv-pulse{ 50%{ text-shadow:0 0 30px color-mix(in srgb, var(--accent) 70%, transparent); transform:scale(1.03); } }
.lv-rest .lbl{ color:var(--muted); text-transform:uppercase; letter-spacing:.14em; font-size:12px; }
.lv-rest .ex{ font-family:var(--display); font-weight:800; font-size:clamp(24px,7vw,40px); text-transform:uppercase; text-align:center; }
.lv-rest .row{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
.lv-rest .row button{ min-width:76px; min-height:52px; border-radius:14px; border:1px solid var(--border2); background:var(--surface); color:var(--text); font-weight:700; font-size:16px; cursor:pointer; }
.lv-rest .row button.skip{ background:var(--accent); color:var(--accent-ink); border:0; min-width:180px; font-family:var(--display); font-size:20px; letter-spacing:.05em; text-transform:uppercase; }
.lv-sheet{ position:fixed; inset:0; z-index:80; background:rgba(0,0,0,.55); display:flex; align-items:flex-end; justify-content:center; }
.lv-sheet > div{ width:100%; max-width:640px; max-height:82vh; overflow:auto; background:var(--surface); border-radius:22px 22px 0 0; border:1px solid var(--border); padding:10px 16px calc(18px + env(safe-area-inset-bottom)); animation:lv-up .28s cubic-bezier(.2,.8,.2,1); }
@keyframes lv-up{ from{ transform:translateY(100%) } to{ transform:none } }
.lv-grab{ width:44px; height:5px; border-radius:3px; background:var(--border2); margin:4px auto 10px; }
.lv-sheet h2{ font-size:22px; text-transform:uppercase; margin:4px 0 2px; text-align:center; }
.lv-sheet .hint{ text-align:center; color:var(--muted); font-size:13px; margin:0 0 6px; }
.lv-q{ display:flex; align-items:center; gap:8px; padding:10px 12px; border-radius:16px; background:var(--surface2); margin:8px 0; border:1px solid transparent; }
.lv-q.dragging{ box-shadow:0 14px 30px rgba(0,0,0,.5); border-color:var(--accent); position:relative; z-index:2; }
.lv-q .nm{ flex:1; min-width:0; } .lv-q .nm b{ font-family:var(--display); font-size:20px; text-transform:uppercase; display:block; overflow-wrap:anywhere; } .lv-q .nm small{ color:var(--muted); }
.lv-q button{ min-width:40px; min-height:40px; border-radius:10px; border:1px solid var(--border2); background:var(--surface); color:var(--text); cursor:pointer; }
.lv-tag{ padding:4px 10px; border-radius:8px; font-family:var(--display); font-weight:700; font-size:13px; letter-spacing:.04em; white-space:nowrap; }
.lv-tag.cur{ background:color-mix(in srgb, var(--accent) 22%, transparent); color:var(--accent); } .lv-tag.next{ background:rgba(255,122,26,.18); color:#ff9a4a; } .lv-tag.done{ background:rgba(47,210,122,.16); color:#2fd27a; }
.lv-handle{ cursor:grab; touch-action:none; font-size:22px; color:var(--muted); padding:6px; user-select:none; }
.lv-add{ width:100%; min-height:52px; border-radius:16px; border:1px dashed color-mix(in srgb, var(--accent) 60%, transparent); background:transparent; color:var(--accent); font-family:var(--display); font-weight:800; font-size:18px; text-transform:uppercase; cursor:pointer; margin-top:6px; }
.lv-search{ width:100%; min-height:48px; border-radius:12px; border:1px solid var(--border2); background:var(--surface2); color:var(--text); padding:0 12px; font-size:16px; margin:6px 0; }
.lv-pick{ display:block; width:100%; text-align:left; min-height:48px; padding:8px 12px; border-radius:12px; border:0; background:transparent; color:var(--text); border-bottom:1px solid var(--border); cursor:pointer; }
.lv-pick small{ color:var(--muted); }
.lv-sum{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin:10px 0 14px; }
.lv-sum div{ background:var(--surface2); border-radius:14px; padding:12px; } .lv-sum b{ display:block; font-family:var(--display); font-size:30px; } .lv-sum small{ color:var(--muted); }
#lv-mini{ position:fixed; left:12px; right:12px; bottom:calc(86px + env(safe-area-inset-bottom)); z-index:55; display:flex; align-items:center; gap:10px; padding:12px 16px; border-radius:18px; border:1px solid var(--border); background:color-mix(in srgb, var(--surface) 92%, transparent); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); color:var(--text); box-shadow:0 12px 30px rgba(0,0,0,.45); cursor:pointer; font:inherit; }
@media (min-width:901px){ #lv-mini{ left:auto; right:24px; bottom:24px; width:360px; } }
#lv-mini .dot{ width:10px; height:10px; border-radius:50%; background:var(--accent); box-shadow:0 0 12px var(--accent); animation:lv-blink 1.6s infinite; flex:none; }
@keyframes lv-blink{ 50%{ opacity:.35 } }
.lv-pr{ position:fixed; left:50%; top:calc(14px + env(safe-area-inset-top)); transform:translateX(-50%); z-index:90; max-width:calc(100% - 24px); background:linear-gradient(90deg,#ff7a1a,#ffb020); color:#120800; padding:12px 18px; border-radius:16px; font-family:var(--display); font-weight:800; font-size:18px; letter-spacing:.03em; box-shadow:0 12px 30px rgba(255,122,26,.4); animation:lv-pop .45s cubic-bezier(.2,1.4,.4,1); text-align:center; }
@keyframes lv-pop{ from{ transform:translateX(-50%) scale(.6); opacity:0 } to{ transform:translateX(-50%) scale(1); opacity:1 } }
canvas.lv-confetti{ position:fixed; inset:0; z-index:85; pointer-events:none; }
.hero-start{ display:block; width:100%; text-align:left; border:1px solid var(--border); border-radius:22px; padding:20px 84px 20px 20px; margin:0 0 14px; background:radial-gradient(500px 200px at 90% 0, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%), var(--surface); color:var(--text); cursor:pointer; position:relative; overflow:hidden; font:inherit; }
.hero-start small{ color:var(--accent); font-family:var(--display); font-weight:700; letter-spacing:.1em; font-size:13px; }
.hero-start b{ display:block; font-family:var(--display); font-weight:800; font-size:clamp(28px,8vw,40px); line-height:1; text-transform:uppercase; margin:6px 0; }
.hero-start span{ color:var(--muted); font-size:14px; }
.hero-start .go{ position:absolute; right:18px; top:50%; margin-top:-28px; width:56px; height:56px; border-radius:50%; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; font-size:24px; font-style:normal; box-shadow:var(--glow); }
.th-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; margin:8px 0 12px; }
.th-opt{ display:flex; align-items:center; gap:10px; min-height:52px; padding:10px; border-radius:14px; border:1px solid var(--border2); background:var(--surface2); color:var(--text); text-align:left; font-weight:600; cursor:pointer; font:inherit; }
.th-opt i{ width:26px; height:26px; border-radius:50%; flex:none; }
.th-opt[aria-pressed="true"]{ outline:2px solid var(--accent); outline-offset:2px; }
.th-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:6px 0; }
.th-row input[type=color]{ width:52px; height:44px; border:0; background:none; padding:0; }
#paletteBtn{ font-size:18px; }
@media (prefers-reduced-motion: reduce){ #live, .lv-rest, .lv-sheet > div, .lv-pr{ animation:none !important; } .lv-rest.ending .t, #lv-mini .dot{ animation:none !important; } .lv-ring circle.p, .lv-log{ transition:none !important; } }
.lv-log{ text-transform:uppercase; }
@media (max-width:440px){ #topGreeting{ display:none; } }
@media (max-width:900px){ .mobilenav a.nav-more-hidden{ display:none !important; } .mobilenav .nav-more{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; flex:1; min-height:52px; border:0; background:none; color:var(--muted); font:inherit; font-size:11px; cursor:pointer; } .mobilenav .nav-more.active{ color:var(--accent); } .mobilenav .nav-more svg{ width:22px; height:22px; } }
@media (min-width:901px){ .mobilenav .nav-more{ display:none; } }
.more-list a{ display:flex; align-items:center; gap:12px; min-height:52px; padding:8px 12px; border-radius:14px; color:var(--text); text-decoration:none; font-weight:600; }
.more-list a svg{ width:22px; height:22px; color:var(--muted); } .more-list a.active{ background:color-mix(in srgb, var(--accent) 14%, transparent); color:var(--accent); } .more-list a.active svg{ color:var(--accent); }
/* measurement */
.ms-kpis{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin:8px 0; }
@media (min-width:700px){ .ms-kpis{ grid-template-columns:repeat(3,minmax(0,1fr)); } }
.ms-kpi{ padding:14px; position:relative; overflow:hidden; } .ms-kpi small{ color:var(--muted); display:block; font-size:12px; } .ms-kpi b.num{ display:block; font-size:30px; line-height:1.1; margin:4px 0 2px; }
.ms-d{ font-size:12px; font-weight:700; color:var(--muted); } .ms-d.up{ color:var(--good); } .ms-d.down{ color:var(--bad); }
.ms-spark{ display:block; width:100%; height:26px; margin-top:6px; opacity:.9; }
.ms-h{ font-size:22px; text-transform:uppercase; margin:18px 0 4px; }
.ms-card{ padding:16px; margin:12px 0; } .ms-card h3{ margin:0 0 8px; }
.ms-two{ display:grid; gap:12px; } @media (min-width:800px){ .ms-two{ grid-template-columns:1fr 1fr; } .ms-two .ms-card{ margin:0; } }
.ms-radar{ display:block; width:100%; max-width:340px; margin:0 auto; } .ms-poly{ transition:all .5s; }
.ms-figs{ display:flex; justify-content:center; gap:8px; } .ms-fig{ width:min(150px,42%); height:auto; } .ms-figs.compact .ms-fig{ width:64px; } .ms-figs.compact + .hint{ display:none; }
.ms-m{ transition:fill .4s; stroke:var(--bg); stroke-width:1; }
.ms-heat-wrap{ overflow-x:auto; padding-bottom:4px; } .ms-heat{ display:flex; gap:3px; width:max-content; } .ms-col{ display:flex; flex-direction:column; gap:3px; }
.ms-c{ display:block; width:11px; height:11px; border-radius:3px; background:var(--surface3); } .ms-c.out{ background:transparent; }
.ms-c.l1{ background:color-mix(in srgb, var(--accent) 25%, var(--surface3)); } .ms-c.l2{ background:color-mix(in srgb, var(--accent) 48%, var(--surface3)); } .ms-c.l3{ background:color-mix(in srgb, var(--accent) 72%, var(--surface3)); } .ms-c.l4{ background:var(--accent); }
.ms-months{ display:flex; gap:3px; width:max-content; font-size:10px; color:var(--muted); } .ms-months span{ width:11px; white-space:nowrap; overflow:visible; }
.ms-legend{ display:flex; align-items:center; gap:4px; justify-content:flex-end; font-size:11px; color:var(--muted); margin-top:6px; }
.ms-rings{ display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:12px; }
.ms-ring{ text-align:center; } .ms-ring svg{ width:96px; height:96px; display:block; margin:0 auto 4px; } .ms-ring b{ display:block; font-size:14px; } .ms-ring small{ color:var(--muted); font-size:11px; }
.ms-arc{ transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1); }
.ms-tg{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--border); } .ms-tg b{ display:block; } .ms-tg small{ color:var(--muted); font-size:12px; }
.ms-tv{ text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:4px; } .ms-tv .num{ font-size:20px; white-space:nowrap; }
.ms-chip{ font-family:var(--display); font-weight:800; font-size:12px; letter-spacing:.05em; padding:3px 8px; border-radius:7px; background:var(--surface3); color:var(--text); white-space:nowrap; }
.ms-chip.addweight{ background:var(--accent); color:var(--accent-ink); } .ms-chip.1rep{ background:color-mix(in srgb, var(--accent) 22%, transparent); color:var(--accent); } .ms-chip.hold{ background:rgba(255,176,32,.18); color:#ffb020; } .ms-chip.start{ background:rgba(76,141,255,.18); color:#7aa8ff; }
.ms-week{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; } .ms-week .ms-ring svg{ width:84px; height:84px; } .ms-mini{ margin-left:auto; }
@media (prefers-reduced-motion: reduce){ .ms-arc, .ms-m, .ms-poly{ transition:none !important; } }
.ql-row{ padding:10px 12px; border-radius:12px; background:var(--surface2); margin:6px 0; } .ql-row small{ display:block; color:var(--muted); margin-top:2px; } .ql-row.ok{ border-left:3px solid var(--good); } .ql-row.bad{ border-left:3px solid var(--bad); } .ql-row.pick{ border-left:3px solid var(--warn); }
.ql-row select{ display:block; margin-top:6px; min-height:44px; width:100%; border-radius:10px; border:1px solid var(--border2); background:var(--surface); color:var(--text); padding:0 8px; }
.lv-tools{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:0 0 10px; }
.lv-tools button{ min-height:40px; padding:0 14px; border-radius:999px; border:1px solid var(--border2); background:var(--surface); color:var(--text); font-weight:600; cursor:pointer; }
.pl-svg{ display:block; width:100%; max-width:420px; margin:10px auto 0; } .pl-txt{ text-align:center; font-size:16px; margin:6px 0; }
.hs-pr{ display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--border); } .hs-pr b{ display:block; overflow-wrap:anywhere; } .hs-pr small{ color:var(--muted); font-size:12px; } .hs-cup{ font-size:22px; }
.hs-tags{ display:flex; flex-direction:column; align-items:flex-end; gap:3px; } .hs-tags .ms-chip{ background:rgba(255,122,26,.18); color:#ff9a4a; }
.hs-recap > small{ color:var(--accent); font-family:var(--display); font-weight:700; letter-spacing:.1em; } .hs-recap h2{ text-align:left; font-size:30px; margin:4px 0 10px; }
.hs-ch{ display:grid; grid-template-columns:1.1fr 1fr .8fr .8fr; align-items:center; gap:8px; padding:10px 0; border-top:1px solid var(--border); } .hs-ch .num{ font-size:22px; } .hs-ch small{ display:block; color:var(--muted); font-size:11px; }
.ph-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:8px; margin-top:12px; }
.ph-th{ padding:0; border:2px solid transparent; border-radius:12px; overflow:hidden; background:var(--surface2); color:var(--text); cursor:pointer; text-align:left; } .ph-th.on{ border-color:var(--accent); }
.ph-th img{ display:block; width:100%; aspect-ratio:3/4; object-fit:cover; } .ph-th span{ display:block; font-size:11px; padding:4px 6px; color:var(--muted); }
.ph-cmp{ position:relative; border-radius:14px; overflow:hidden; background:#000; } .ph-cmp img{ display:block; width:100%; max-height:62vh; object-fit:contain; } .ph-cmp img + img{ position:absolute; inset:0; height:100%; }

/* Oct 2026: leave room under the floating tab bar (and the workout bar) so the end of every page can scroll clear of them */
@media (max-width:900px){ #view{ padding-bottom:calc(112px + env(safe-area-inset-bottom)) !important; } body.has-mini #view{ padding-bottom:calc(184px + env(safe-area-inset-bottom)) !important; } }
@media (min-width:901px){ body.has-mini #view{ padding-bottom:110px !important; } }
.lv-ss{ text-align:center; color:var(--accent); font-family:var(--display); font-weight:800; letter-spacing:.12em; font-size:13px; margin-top:12px; }
.lv-q.ss{ border-left:3px solid var(--accent); } .lv-ssl{ font-family:var(--display); font-weight:800; color:var(--accent); min-width:24px; }
.lv-q button[aria-pressed="true"]{ background:var(--accent); color:var(--accent-ink); border-color:transparent; }
.ph-bk{ margin:12px 0 4px; padding:12px; border-radius:14px; background:var(--surface2); }
/* Oct 2026: queue rows wrap their controls under the name instead of squeezing it */
.lv-q{ flex-wrap:wrap; } .lv-q .nm{ flex:1 1 150px; min-width:150px; } .lv-q .nm b{ font-size:18px; }
.ex-link{ background:none; border:0; padding:0; color:inherit; font:inherit; font-weight:700; text-align:left; cursor:pointer; text-decoration:underline dotted; text-underline-offset:3px; min-height:24px; }
.lv-last .ex-link{ font-weight:600; color:var(--accent); margin-left:6px; }
.ov-top{ display:flex; align-items:baseline; gap:6px; flex-wrap:wrap; } .ov-n{ font-size:44px; line-height:1; } .ov-of{ color:var(--muted); font-family:var(--display); font-size:20px; }

/* ============================================================================
   DB layer — namespaced localStorage. One key per slice.
============================================================================ */

const SLICES=["meta","profile","app","settings","goals","program","exercises","landmarks","strengthGoals","milestones","sessions","body","nutrition","recovery"];
const DB={
 read(slice,fallback){
   try{const raw=localStorage.getItem(NS+slice);return raw==null?fallback:JSON.parse(raw);}
   catch(e){return fallback;}
 },
 _warned:false,
 write(slice,val){
   try{localStorage.setItem(NS+slice,JSON.stringify(val));this._warned=false;return true;}
   catch(e){ if(!this._warned){ this._warned=true; toast("Storage unavailable here — changes won’t persist. Open the file directly in your browser to save.","bad"); } return false;}
 },
 clearAll(){ try{SLICES.forEach(s=>localStorage.removeItem(NS+s));}catch(e){} }
};

let S=null; // live state

function loadState(){
 const d=defaults();
 const out={};
 SLICES.forEach(s=>{ out[s]=DB.read(s, d[s]); });
 // ensure structural completeness for forward-compat
 out.app.dashboardCards = out.app.dashboardCards || d.app.dashboardCards;
 out.settings = Object.assign({}, d.settings, out.settings);
 out.goals = Object.assign({}, d.goals, out.goals);

 return out;
}
/* Safe, additive migrations. Never destroys user data; only fills in new structures. */
function migrate(state){
 let v=state.meta.version||1;
 let changed=false;
 if(v<2){
   // v2: introduced built-in "Full Body" and "Shoulders & Arms" session templates.
   state.program.split=state.program.split||{};
   Object.keys(SEED_SPLIT).forEach(k=>{ if(!(k in state.program.split)){ state.program.split[k]=SEED_SPLIT[k].slice(); changed=true; } });
   v=2;
 }
 if(state.meta.version!==SCHEMA_VERSION){ state.meta.version=SCHEMA_VERSION; changed=true; }
 return changed;
}
function save(...slices){ slices.forEach(s=>DB.write(s,S[s])); }
function saveAll(){ SLICES.forEach(s=>DB.write(s,S[s])); }

/* ============================================================================

============================================================================ */
const isImperial=()=>S.settings.units==="imperial";
const unitW=()=>isImperial()?"lb":"kg";
const unitL=()=>isImperial()?"in":"cm";
function dispW(kg){ if(kg==null||kg==="")return null; return isImperial()? kg*LB_PER_KG : kg; }
function inW(v){ const n=num(v); return isImperial()? n*KG_PER_LB : n; }   // input -> kg
function dispL(cm){ if(cm==null||cm==="")return null; return isImperial()? cm*IN_PER_CM : cm; }
function inL(v){ const n=num(v); return isImperial()? n*CM_PER_IN : n; }   // input -> cm
function wStr(kg,d=1){ const v=dispW(kg); return v==null?"—":fmtNum(v,d)+" "+unitW(); }

============================================================================ */
function e1rm(load,reps){ if(reps<=0)return 0; if(reps===1)return load; /* Oct 2026: a single IS the 1RM (was load × 1.033) */ return load*(1+reps/30); }
function allSets(){
 const out=[];
 S.sessions.forEach(s=>{(s.sets||[]).forEach(set=>{ if(set.type==="warmup")return; /* Oct 2026: warm-ups don't count toward e1RM, PRs or hard sets */
   out.push({...set,date:s.date,week:s.week,day:s.day,sessionId:s.id});
 });});
 return out;
}
function bestE1RM(exercise,uptoWeek){
 let best=0;
 allSets().forEach(x=>{ if(x.exercise===exercise && (uptoWeek==null||x.week<=uptoWeek)){
   const e=e1rm(x.load,x.reps); if(e>best)best=e; }});
 return best;
}
function weeklyE1RM(exercise){ // map week->best e1rm that week
 const m={};
 allSets().forEach(x=>{ if(x.exercise===exercise){ const e=e1rm(x.load,x.reps); if(!(x.week in m)||e>m[x.week])m[x.week]=e; }});
 return m;
}
function hardSetsByMuscle(week){
 const m={}; MUSCLES.forEach(mu=>m[mu]=0);
 allSets().forEach(x=>{ if(x.week===week && x.reps>0 && x.rir<=3){ if(!(x.muscle in m))m[x.muscle]=0; m[x.muscle]++; }});
 return m;
}
function landmarkFor(muscle){ return S.landmarks.find(l=>l.muscle===muscle); }
function volStatus(count,lm){
 if(!lm)return {label:count>0?"Logged":"—",cls:count>0?"acc":"mut"};

 if(count<lm.mev)return {label:"Below MEV",cls:"warn"};
 if(count>lm.mrv)return {label:"Over MRV",cls:"bad"};
 if(count>=lm.mavLo && count<=lm.mavHi)return {label:"Optimal (MAV)",cls:"good"};
 return {label:"Productive",cls:"good"};
}
function readiness(rec){
 // average of sleep quality, energy, inverted soreness, inverted stress → 1..5
 const vals=[rec.quality,rec.energy,6-rec.soreness,6-rec.stress].filter(v=>isFinite(v)&&v>0);
 if(!vals.length)return null;
 return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
}
function weeksWithSessions(){ return new Set(S.sessions.map(s=>s.week)); }
function sessionsInWeek(w){ return S.sessions.filter(s=>s.week===w).length; }
function currentBodyWeight(){
 if(S.body.length){ const sorted=[...S.body].sort((a,b)=>(a.week||0)-(b.week||0)); const last=sorted[sorted.length-1]; if(last&&last.weight)return last.weight; }
 return S.goals.currentWeight||S.goals.startWeight;
}
function startBodyWeight(){
 if(S.body.length){ const sorted=[...S.body].sort((a,b)=>(a.week||0)-(b.week||0)); if(sorted[0]&&sorted[0].weight)return sorted[0].weight; }
 return S.goals.startWeight;
}

   const rs=byWeek[w]; const reads=rs.map(readiness).filter(v=>v!=null);
   const sleeps=rs.map(r=>r.sleep).filter(v=>isFinite(v)&&v>0);
   const avgR=reads.length?reads.reduce((a,b)=>a+b,0)/reads.length:null;
   const avgS=sleeps.length?sleeps.reduce((a,b)=>a+b,0)/sleeps.length:null;
   if((avgR!=null&&avgR<3)||(avgS!=null&&avgS<S.goals.minSleep)) count++;
 });
 return count;
}
function currentStreak(){
 const weeks=[...weeksWithSessions()].sort((a,b)=>a-b);
 if(!weeks.length)return 0;
 let streak=1;
 for(let i=weeks.length-1;i>0;i--){ if(weeks[i]-weeks[i-1]===1)streak++; else break; }
 return streak;
}
function allTimePRs(){
 const map={};
 allSets().forEach(x=>{ const e=e1rm(x.load,x.reps);
   if(!map[x.exercise]||e>map[x.exercise].e1rm) map[x.exercise]={e1rm:e,load:x.load,reps:x.reps,date:x.date}; });
 return map;
}
function keyLifts(){
 // key lifts = strength-goal lifts that exist, else the most-logged compound lifts
 const goalNames=S.strengthGoals.filter(g=>!g.archived).map(g=>g.name);
 const logged=new Set(allSets().map(x=>x.exercise));
 let lifts=goalNames.filter(n=>logged.has(n));
 if(lifts.length<3){
   const counts={}; allSets().forEach(x=>counts[x.exercise]=(counts[x.exercise]||0)+1);
   const top=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
   top.forEach(n=>{ if(lifts.length<5&&!lifts.includes(n))lifts.push(n); });
 }
 return lifts.slice(0,5);
}

function contrastInk(hex){
 const c=hex.replace('#',''); if(c.length<6)return '#fff';
 const r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16);
 const L=(0.299*r+0.587*g+0.114*b)/255; return L>0.62?'#111827':'#ffffff';
}
function relLum(hex){ const c=hex.replace('#','');if(c.length<6)return 0;
 const ch=i=>{let v=parseInt(c.substr(i,2),16)/255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);};
 return 0.2126*ch(0)+0.7152*ch(2)+0.0722*ch(4); }
function contrastRatio(a,b){ const hi=Math.max(relLum(a),relLum(b)),lo=Math.min(relLum(a),relLum(b)); return (hi+0.05)/(lo+0.05); }
function accentWarning(accent){
 const surf=S.app.theme==='light'?'#ffffff':'#161b22';
 const cr=contrastRatio(accent,surf);
 return cr<3 ? '<div class="pill warn" style="display:block;margin:4px 0 12px">Low contrast ('+cr.toFixed(1)+':1) — accent-colored text may be hard to read on this theme. Buttons stay readable automatically; consider a bolder color.</div>' : '';
}
function faviconURI(accent){

 return "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='"+a+"'/%3E%3Cg fill='white'%3E%3Crect x='16' y='42' width='10' height='16' rx='2'/%3E%3Crect x='26' y='36' width='9' height='28' rx='2'/%3E%3Crect x='35' y='46' width='30' height='8'/%3E%3Crect x='65' y='36' width='9' height='28' rx='2'/%3E%3Crect x='74' y='42' width='10' height='16' rx='2'/%3E%3C/g%3E%3C/svg%3E";
}

function roundRectPath(x,X,Y,W,H,R){ R=Math.min(R,W/2,H/2); x.beginPath(); x.moveTo(X+R,Y); x.arcTo(X+W,Y,X+W,Y+H,R); x.arcTo(X+W,Y+H,X,Y+H,R); x.arcTo(X,Y+H,X,Y,R); x.arcTo(X,Y,X+W,Y,R); x.closePath(); }
function iconDataURL(size){
 try{
   const c=document.createElement('canvas'); c.width=size; c.height=size;
   const x=c.getContext('2d'); if(!x)return null;
   const g=x.createLinearGradient(0,0,size,size);
   g.addColorStop(0,S.app.accent||'#5b7cfa'); g.addColorStop(1,S.app.accent2||'#22d3ee');
   x.fillStyle=g; roundRectPath(x,0,0,size,size,size*0.22); x.fill();
   x.fillStyle='#ffffff'; const s=size/100;
   [[16,42,10,16],[26,36,9,28],[35,46,30,8],[65,36,9,28],[74,42,10,16]].forEach(b=>{ roundRectPath(x,b[0]*s,b[1]*s,b[2]*s,b[3]*s,2*s); x.fill(); });
   return c.toDataURL('image/png');
 }catch(e){ return null; }
}
function ensureMeta(name,content){ let m=document.querySelector('meta[name="'+name+'"]'); if(!m){ m=document.createElement('meta'); m.setAttribute('name',name); document.head.appendChild(m); } m.setAttribute('content',content); }
function buildManifest(){
 try{
   // Guarantee the standalone/install meta tags exist in the live DOM even if a host stripped the static <head>.
   ensureMeta('apple-mobile-web-app-capable','yes');
   ensureMeta('mobile-web-app-capable','yes');
   ensureMeta('apple-mobile-web-app-status-bar-style','black-translucent');
   const name=S.app.appName||'Pentra Forge';
   const icon180=iconDataURL(180);
   const ai=$('#appleIcon'); if(ai&&icon180)ai.setAttribute('href',icon180);
   const at=$('#appleTitle'); if(at)at.setAttribute('content',name);
   // Full manifest (Android/desktop install). Skip on file:// to avoid a noisy console warning.
   if(!/^https?:/.test(location.protocol))return; if(window.STRENGTH_PWA){ let l=$('#manifestLink'); if(!l){ l=document.createElement('link'); l.rel='manifest'; l.id='manifestLink'; document.head.appendChild(l); } l.setAttribute('href','manifest.webmanifest'); return; } /* Oct 2026: hosted app uses the real manifest file */
   const bg=S.app.theme==='light'?'#f4f6fa':'#0e1116';
   const icon192=iconDataURL(192), icon512=iconDataURL(512);
   const manifest={ name, short_name:(name.length>12?name.slice(0,12):name), start_url:'.', scope:'.',
     display:'standalone', orientation:'portrait', background_color:bg, theme_color:bg,
     icons:[{src:icon192,sizes:'192x192',type:'image/png',purpose:'any maskable'},{src:icon512,sizes:'512x512',type:'image/png',purpose:'any maskable'}] };
   if(_manifestURL)URL.revokeObjectURL(_manifestURL);
   _manifestURL=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'}));
   let link=$('#manifestLink'); if(!link){ link=document.createElement('link'); link.rel='manifest'; link.id='manifestLink'; document.head.appendChild(link); }
   link.setAttribute('href',_manifestURL);
 }catch(e){}
}
function isStandalone(){ return (window.navigator.standalone===true) || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches); }
function platform(){ const ua=navigator.userAgent||''; if(/iPhone|iPad|iPod/i.test(ua) || (navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1))return 'ios'; if(/Android/i.test(ua))return 'android'; return 'desktop'; }

function openModal(opts){
 const host=$("#modalHost");
 const opener=document.activeElement;
 const ov=document.createElement("div"); ov.className="overlay";
 ov.innerHTML='<div class="modal '+(opts.wide?'wide':'')+'" role="dialog" aria-modal="true" aria-label="'+esc(opts.title)+'" tabindex="-1">'+
   '<div class="modal-head"><h2>'+esc(opts.title)+'</h2>'+
   '<button class="iconbtn" data-x aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>'+
   '<div class="modal-body">'+opts.body+'</div>'+
   (opts.foot!==false?'<div class="modal-foot">'+(opts.foot||('<button class="btn ghost" data-x>Cancel</button><button class="btn primary" data-ok>'+esc(opts.okLabel||"Save")+'</button>'))+'</div>':'')+
   '</div>';
 host.appendChild(ov);
 const modalEl=$('.modal',ov);
 const focusables=()=>$$('a[href],button:not([disabled]),input:not([disabled]):not([hidden]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])',ov);
 const onKey=(e)=>{
   if(e.key==='Escape'){ e.preventDefault(); close(); }
   else if(e.key==='Tab'){
     const f=focusables(); if(!f.length){ e.preventDefault(); return; }
     const first=f[0], last=f[f.length-1];
     if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
     else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
   }
 };
 const close=()=>{ document.removeEventListener('keydown',onKey,true); ov.remove(); if(opener&&opener.focus){ try{opener.focus();}catch(e){} } };
 ov.addEventListener("click",e=>{ if(e.target===ov)close(); });
 $$('[data-x]',ov).forEach(b=>b.addEventListener("click",close));
 const okBtn=$('[data-ok]',ov);
 if(okBtn&&opts.onOk) okBtn.addEventListener("click",()=>{ const r=opts.onOk(ov); if(r!==false)close(); });
 document.addEventListener('keydown',onKey,true);
 if(opts.onOpen)opts.onOpen(ov);
 // Initial focus: first form field if any, else the dialog itself (avoids auto-focusing a destructive button).
 const firstInput=$('.modal-body input:not([hidden]),.modal-body select,.modal-body textarea',ov);
 (firstInput||modalEl).focus();
 return {ov,close};
}

function card(title,body,span2){
 return '<div class="card'+(span2?' span2':'')+'"><h3>'+esc(title)+'</h3>'+body+'</div>';
}
function shortName(n){ return n.replace(/Barbell |Standing |Weighted /g,'').replace(' Press',' Prs'); }
function phaseForWeek(w){
 for(const ph of S.program.phases){
   const m=String(ph.weeks).match(/(\d+)\D+(\d+)/);
   if(m){ if(w>=+m[1]&&w<=+m[2])return ph; }
   else { const s=String(ph.weeks).match(/\d+/); if(s&&+s[0]===w)return ph; }
 }
 return null;
}
function nextTrainingDay(){
 const days=S.program.trainingDays; if(!days.length)return sessionTypes()[0]||"";
 const week=S.program.currentWeek;
 const doneDays=new Set(S.sessions.filter(s=>s.week===week).map(s=>s.day));
 for(const d of days){ if(!doneDays.has(d))return d; }
 return days[0];
}
// The full menu of session types: your rotation days first, then any other built-in
// or custom template that exists — so every template with exercises is pickable.
function sessionTypes(){
 const seen=new Set(), out=[];
 (S.program.trainingDays||[]).forEach(d=>{ if(d&&!seen.has(d)){seen.add(d);out.push(d);} });
 Object.keys(S.program.split||{}).forEach(d=>{ if(d&&!seen.has(d)){seen.add(d);out.push(d);} });
 return out;
}

 }
 // milestones
 h+='<div class="sec-head"><h2>Milestones</h2><button class="btn ghost sm" id="addMS">'+ICON.plus+' Add</button></div>';
 const msActive=S.milestones.filter(m=>m.status!=='Archived');

 if(!S.milestones.length){ h+=emptyState("No milestones yet.","Add a long-horizon goal like '20 pull-ups'."); }
 else{
   h+='<div class="grid cards">'+msActive.map(milestoneCard).join('')+'</div>';
   if(!msActive.length) h+='<div class="sub" style="margin-top:8px">All milestones are archived.</div>';
   if(msArchived.length){
     h+='<div class="sec-head" style="margin-top:18px"><h2 style="font-size:14px;color:var(--muted)">Archived ('+msArchived.length+')</h2></div>';
     h+='<div class="card">'+msArchived.map(m=>'<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0"><span>'+esc(m.name)+' <span class="tag">'+esc(m.category||'')+'</span></span><span class="flexwrap"><button class="btn ghost sm" data-restorems="'+m.id+'">Restore</button><button class="btn danger sm" data-delms="'+m.id+'">Delete</button></span></div>').join('')+'</div>';

 }

 $$('[data-archsg]').forEach(b=>b.addEventListener("click",()=>{ const g=S.strengthGoals.find(x=>x.id===b.dataset.archsg); g.archived=true; save("strengthGoals"); router(); toast("Goal archived."); }));
 $$('[data-restoresg]').forEach(b=>b.addEventListener("click",()=>{ const g=S.strengthGoals.find(x=>x.id===b.dataset.restoresg); g.archived=false; save("strengthGoals"); router(); toast("Goal restored."); }));
 $$('[data-editms]').forEach(b=>b.addEventListener("click",()=>editMilestone(b.dataset.editms)));

function milestoneCard(m){
 const pct=m.target?clamp(Math.round((m.current||0)/m.target*100),0,100):(m.status==='Achieved'?100:0);
 return '<div class="card"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><div><h3 style="text-transform:none;font-size:14.5px;color:var(--text)">'+esc(m.name)+'</h3><div class="tag">'+esc(m.category||'')+'</div> <span class="sub">'+esc(m.horizon||'')+'</span></div>'+
   '<span class="pill '+msPillClass(m.status)+'">'+esc(m.status||'In Progress')+'</span></div>'+
   ((m.unit!=='achieved'&&m.target)?'<div class="sub" style="margin-top:8px">'+(m.current||0)+' / '+m.target+' '+esc(m.unit||'')+'</div><div class="bar"><i style="width:'+pct+'%"></i></div>':'')+
   (m.deadline?'<div class="sub" style="margin-top:6px">🎯 by '+fmtDateShort(m.deadline)+'</div>':'')+
   (m.notes?'<div class="sub" style="margin-top:6px">'+esc(m.notes)+'</div>':'')+
   '<div class="flexwrap" style="margin-top:10px"><button class="btn ghost sm" data-editms="'+m.id+'">Edit</button>'+
   (m.status==='Achieved'?'<button class="btn ghost sm" data-unms="'+m.id+'">Reopen</button>':'<button class="btn primary sm" data-doms="'+m.id+'">Mark achieved</button>')+
   '<button class="btn ghost sm" data-archms="'+m.id+'">Archive</button>'+
   '<button class="btn danger sm" data-delms="'+m.id+'">Delete</button></div></div>';
}
function bestRepsFor(name){ let m=0; allSets().forEach(x=>{ if(x.exercise===name&&x.reps>m)m=x.reps; }); return m; }
function editStrengthGoal(id){
 const g=id?S.strengthGoals.find(x=>x.id===id):{name:"",target:"",type:"weight",achieved:false};
 const exOpts=S.exercises.map(e=>'<option'+(e.name===g.name?' selected':'')+'>'+esc(e.name)+'</option>').join('');
 openModal({title:id?"Edit strength goal":"Add strength goal",body:
   '<div class="field"><label>Lift</label><input list="exdl" id="sgName" value="'+esc(g.name)+'" placeholder="e.g. Barbell Bench Press"><datalist id="exdl">'+exOpts+'</datalist></div>'+
   '<div class="row"><div class="field"><label>Type</label><select id="sgType"><option value="weight"'+(g.type==="weight"?' selected':'')+'>Weight (e1RM)</option><option value="reps"'+(g.type==="reps"?' selected':'')+'>Reps</option></select></div>'+
   '<div class="field"><label>Target</label><input type="number" step="any" id="sgTarget" value="'+esc(g.target)+'"></div></div>'+
   '<div class="hint">Weight targets are compared against your best estimated 1RM; rep targets against your best logged reps.</div>',
   onOk:()=>{
     const name=$("#sgName").value.trim(); if(!name){toast("Enter a lift name.","bad");return false;}
     const type=$("#sgType").value; let target=num($("#sgTarget").value);
     // target entered in display units for weight → store kg
     if(type==="weight")target=inW($("#sgTarget").value);
     if(id){ Object.assign(g,{name,type,target}); } else { S.strengthGoals.push({id:uid(),name,type,target,achieved:false}); }
     save("strengthGoals"); router(); toast("Saved.","good");
   },
   onOpen:(ov)=>{ // show weight target in display units
     if(g.type==="weight"&&g.target){ $("#sgTarget",ov).value=fmtNum(dispW(g.target),1); }
   }});
}
const MS_STATUSES=["Not Started","In Progress","Achieved","Paused","Archived"];
function msPillClass(status){ return status==='Achieved'?'good':status==='Paused'?'warn':(status==='Archived'||status==='Not Started')?'mut':'acc'; }
function editMilestone(id){
 const m=id?S.milestones.find(x=>x.id===id):{name:"",category:"Calisthenics",target:"",unit:"reps",current:0,horizon:"",status:"In Progress",notes:"",deadline:""};
 openModal({title:id?"Edit milestone":"Add milestone",body:
   '<div class="field"><label>Milestone</label><input id="msName" value="'+esc(m.name)+'" placeholder="e.g. 20 strict pull-ups"></div>'+
   '<div class="row"><div class="field"><label>Category</label><input id="msCat" value="'+esc(m.category||'')+'" placeholder="Calisthenics"></div>'+
   '<div class="field"><label>Status</label><select id="msStatus">'+MS_STATUSES.map(s=>'<option'+(s===(m.status||'In Progress')?' selected':'')+'>'+s+'</option>').join('')+'</select></div></div>'+
   '<div class="row3"><div class="field"><label>Target</label><input type="number" step="any" id="msTarget" value="'+esc(m.target)+'"></div>'+
   '<div class="field"><label>Current</label><input type="number" step="any" id="msCur" value="'+esc(m.current||0)+'"></div>'+
   '<div class="field"><label>Unit</label><input id="msUnit" value="'+esc(m.unit||'reps')+'" placeholder="reps"></div></div>'+
   '<div class="row"><div class="field"><label>Horizon</label><input id="msHz" value="'+esc(m.horizon||'')+'" placeholder="Month 6"></div>'+
   '<div class="field"><label>Deadline (optional)</label><input type="date" id="msDead" value="'+esc(m.deadline||'')+'"></div></div>'+
   '<div class="field"><label>Notes (optional)</label><textarea id="msNotes" placeholder="Progressions, cues, etc.">'+esc(m.notes||'')+'</textarea></div>',
   onOk:()=>{
     const name=$("#msName").value.trim(); if(!name){toast("Enter a milestone.","bad");return false;}
     const status=$("#msStatus").value;
     const data={name,category:$("#msCat").value,horizon:$("#msHz").value,target:num($("#msTarget").value),
       current:num($("#msCur").value),unit:$("#msUnit").value||'reps',status,notes:$("#msNotes").value,deadline:$("#msDead").value};
     if(id){ Object.assign(m,data); m.achievedAt = status==="Achieved" ? (m.achievedAt||todayISO()) : ""; }
     else { S.milestones.push({id:uid(),createdAt:todayISO(),achievedAt:status==="Achieved"?todayISO():"",...data}); }
     save("milestones"); router(); toast("Saved.","good");
   }});
}

/* ============================================================================

============================================================================ */
function renderSettings(v){
 let h=pageHead("Settings","Personalize the app, your profile, training defaults, goals, and manage your data.");
 h+='<div id="setTabs" class="flexwrap" style="margin-bottom:18px">'+
   ['profile','app','training','exercises','goals','program','data','install'].map((t,i)=>'<button class="chip'+(i===0?' on':'')+'" data-set="'+t+'">'+t.charAt(0).toUpperCase()+t.slice(1)+'</button>').join('')+'</div>'+
   '<div id="setBody"></div>';
 v.innerHTML=h;
 $$('#setTabs .chip').forEach(c=>c.addEventListener("click",()=>{ $$('#setTabs .chip').forEach(x=>x.classList.remove("on")); c.classList.add("on"); setTab(c.dataset.set); }));
 setTab("profile");
}
function setTab(t){
 const map={profile:setProfile,app:setApp,training:setTraining,exercises:setExercises,goals:setGoals,program:setProgram,data:setData,install:setInstall};
 map[t]($("#setBody"));
}
function setProfile(host){
 const p=S.profile;
 host.innerHTML='<div class="card">'+
   '<div style="display:flex;align-items:center;gap:14px;margin-bottom:16px">'+
     '<div class="avatar" id="avPrev">'+(p.avatar?'<img src="'+esc(p.avatar)+'" style="width:100%;height:100%;border-radius:50%;object-fit:cover">':initials(p.displayName))+'</div>'+
     '<div><button class="btn ghost sm" id="avBtn">Upload photo</button> '+(p.avatar?'<button class="btn ghost sm" id="avClear">Remove</button>':'')+
     '<input type="file" accept="image/*" id="avFile" hidden></div></div>'+
   '<div class="field"><label>Display name</label><input id="pName" value="'+esc(p.displayName)+'" placeholder="Your name (optional)"></div>'+
   '<div class="row3"><div class="field"><label>Age (optional)</label><input type="number" id="pAge" value="'+esc(p.age)+'"></div>'+
   '<div class="field"><label>Height (optional, '+unitL()+')</label><input type="number" step="any" id="pHeight" value="'+(p.height?fmtNum(dispL(p.height),1):'')+'"></div>'+
   '<div class="field"><label>Gender (optional)</label><select id="pGender">'+opt(['','Male','Female','Other','Prefer not to say'],p.gender)+'</select></div></div>'+
   '<div class="field"><label>Training experience (optional)</label><select id="pExp">'+opt(['','Beginner','Intermediate','Advanced'],p.experience)+'</select></div>'+
   '<button class="btn primary" id="saveProfile">Save profile</button></div>';
 $("#avBtn",host).addEventListener("click",()=>$("#avFile",host).click());
 $("#avFile",host).addEventListener("change",e=>{
   const f=e.target.files[0]; if(!f)return; if(f.size>1.5*1024*1024){toast("Image too large (max ~1.5MB).","bad");return;}
   const r=new FileReader(); r.onload=()=>{ p.avatar=r.result; save("profile"); setProfile(host); toast("Photo updated.","good"); }; r.readAsDataURL(f);
 });
 const clr=$("#avClear",host); if(clr)clr.addEventListener("click",()=>{ p.avatar=null; save("profile"); setProfile(host); });
 $("#saveProfile",host).addEventListener("click",()=>{
   p.displayName=$("#pName").value.trim(); p.age=$("#pAge").value; p.height=$("#pHeight").value?inL($("#pHeight").value):"";
   p.gender=$("#pGender").value; p.experience=$("#pExp").value;
   save("profile"); refreshGreeting(); toast("Profile saved.","good");
 });
}
function initials(name){ if(!name)return '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>';
 return name.trim().split(/\s+/).slice(0,2).map(w=>w[0].toUpperCase()).join(''); }
function opt(list,sel){ return list.map(o=>'<option value="'+esc(o)+'"'+(o===sel?' selected':'')+'>'+(o||'—')+'</option>').join(''); }

function setApp(host){
 const a=S.app;
 host.innerHTML='<div class="card">'+
   '<div class="field"><label>App name</label><input id="aName" value="'+esc(a.appName)+'" placeholder="Pentra Forge"></div>'+
   '<div class="hint" style="margin-bottom:16px">Updates the header, browser tab, and export metadata.</div>'+
   '<label>Theme</label><div class="flexwrap" style="margin-bottom:16px"><button class="chip'+(a.theme==="dark"?' on':'')+'" data-theme="dark">Dark</button><button class="chip'+(a.theme==="light"?' on':'')+'" data-theme="light">Light</button></div>'+
   '<label>Accent color</label><div class="swatches" id="swatches" style="margin-bottom:14px">'+
     ACCENT_PRESETS.map(pr=>'<button type="button" class="swatch'+(pr[0]===a.accent?' sel':'')+'" data-acc="'+pr[0]+'" data-acc2="'+pr[1]+'" aria-label="Accent color '+pr[0]+'" style="background:linear-gradient(135deg,'+pr[0]+','+pr[1]+');color:'+pr[0]+'"></button>').join('')+'</div>'+
   '<div class="row"><div class="field"><label>Custom primary</label><input type="color" id="aAcc" value="'+esc(a.accent)+'"></div>'+
   '<div class="field"><label>Custom secondary</label><input type="color" id="aAcc2" value="'+esc(a.accent2)+'"></div></div>'+
   '<div id="contrastNote">'+accentWarning(a.accent)+'</div>'+
   '<button class="btn primary" id="saveApp">Save appearance</button>'+
   '</div>'+
   '<div class="card" style="margin-top:14px"><h3>Dashboard cards</h3><div class="sub" style="margin-bottom:12px">Choose which cards appear on your dashboard.</div><div id="cardToggles"></div></div>';
 // theme chips
 $$('[data-theme]',host).forEach(b=>b.addEventListener("click",()=>{ a.theme=b.dataset.theme; save("app"); applyBranding(); setApp(host); }));
 // swatches
 $$('#swatches .swatch',host).forEach(s=>s.addEventListener("click",()=>{ a.accent=s.dataset.acc;a.accent2=s.dataset.acc2; save("app"); applyBranding(); setApp(host); }));
 $("#aAcc",host).addEventListener("input",e=>{ a.accent=e.target.value; applyBranding(); const cn=$("#contrastNote",host); if(cn)cn.innerHTML=accentWarning(e.target.value); });
 $("#aAcc2",host).addEventListener("input",e=>{ a.accent2=e.target.value; applyBranding(); });
 $("#saveApp",host).addEventListener("click",()=>{ a.appName=$("#aName").value.trim()||"Pentra Forge"; a.accent=$("#aAcc").value;a.accent2=$("#aAcc2").value; save("app"); applyBranding(); toast("Appearance saved.","good"); });
 // card toggles
 const ct=$("#cardToggles",host); const enabled=new Set(a.dashboardCards);
 ct.innerHTML=DASHBOARD_CARDS.map(c=>'<div class="switch"><div class="t">'+esc(c.label)+'</div><label class="toggle"><input type="checkbox" data-card="'+c.id+'"'+(enabled.has(c.id)?' checked':'')+'><span class="track"></span></label></div>').join('');
 $$('[data-card]',ct).forEach(cb=>cb.addEventListener("change",()=>{
   const id=cb.dataset.card; let arr=a.dashboardCards.filter(x=>x!==id);
   if(cb.checked){ // preserve canonical order
     arr=DASHBOARD_CARDS.filter(c=>c.id===id||a.dashboardCards.includes(c.id)).map(c=>c.id);
   }
   a.dashboardCards=arr; save("app"); toast("Dashboard updated.");
 }));
}
function setTraining(host){
 const s=S.settings;
 host.innerHTML='<div class="card">'+
   '<label>Units</label><div class="flexwrap" style="margin-bottom:16px"><button class="chip'+(s.units==="metric"?' on':'')+'" data-u="metric">Metric (kg / cm)</button><button class="chip'+(s.units==="imperial"?' on':'')+'" data-u="imperial">Imperial (lb / in)</button></div>'+
   '<div class="hint" style="margin-bottom:16px">Changing units only changes the display — your stored history is never altered.</div>'+
   '<div class="row"><div class="field"><label>Default RIR</label><input type="number" id="tRir" value="'+s.defaultRIR+'"></div>'+
   '<div class="field"><label>Rest timer (seconds)</label><input type="number" id="tRest" value="'+s.restTimer+'"></div></div>'+
   '<div class="row"><div class="field"><label>Weight increment ('+unitW()+')</label><input type="number" step="any" id="tInc" value="'+fmtNum(dispW(s.weightIncrement),2)+'"></div>'+
   '<div class="field"><label>Barbell weight ('+unitW()+')</label><input type="number" step="any" id="tBar" value="'+fmtNum(dispW(s.barbellWeight),1)+'"></div></div>'+
   '<div class="field"><label>Available plates ('+unitW()+' each, comma-separated)</label><input id="tPlates" value="'+s.plates.map(p=>fmtNum(dispW(p),2)).join(', ')+'"></div>'+
   '<div class="field"><label>Workout duration target (min)</label><input type="number" id="tDur" value="'+s.workoutDuration+'"></div>'+
   '<div class="switch"><div><div class="t">Automatic rest timer</div><div class="d">Start rest countdown after each set</div></div><label class="toggle"><input type="checkbox" id="tAuto"'+(s.autoRestTimer?' checked':'')+'><span class="track"></span></label></div>'+
   '<div class="switch"><div><div class="t">Vibration</div><div class="d">Buzz on save / timer (where supported)</div></div><label class="toggle"><input type="checkbox" id="tVib"'+(s.vibration?' checked':'')+'><span class="track"></span></label></div>'+
   '<div class="switch"><div><div class="t">Sound</div><div class="d">Play a tone on rest-timer end</div></div><label class="toggle"><input type="checkbox" id="tSnd"'+(s.sound?' checked':'')+'><span class="track"></span></label></div>'+
   '<div class="switch"><div><div class="t">Notifications</div><div class="d">Browser notifications where supported</div></div><label class="toggle"><input type="checkbox" id="tNot"'+(s.notifications?' checked':'')+'><span class="track"></span></label></div>'+
   '<button class="btn primary" id="saveTrain" style="margin-top:14px">Save training settings</button></div>';
 $$('[data-u]',host).forEach(b=>b.addEventListener("click",()=>{ s.units=b.dataset.u; save("settings"); setTraining(host); toast("Units set to "+b.dataset.u+"."); }));
 $("#saveTrain",host).addEventListener("click",()=>{
   s.defaultRIR=Math.round(num($("#tRir").value)); s.restTimer=Math.round(num($("#tRest").value));
   s.weightIncrement=inW($("#tInc").value)||2.5; s.barbellWeight=inW($("#tBar").value)||20;
   s.plates=$("#tPlates").value.split(',').map(x=>inW(x.trim())).filter(x=>x>0);
   s.workoutDuration=Math.round(num($("#tDur").value));
   s.autoRestTimer=$("#tAuto").checked; s.vibration=$("#tVib").checked; s.sound=$("#tSnd").checked; s.notifications=$("#tNot").checked;
   if(s.notifications&&"Notification"in window&&Notification.permission==="default"){ Notification.requestPermission(); }
   save("settings"); toast("Training settings saved.","good");
 });
}
function setGoals(host){
 const g=S.goals;
 host.innerHTML='<div class="card"><h3>Bodyweight</h3>'+
   '<div class="row3"><div class="field"><label>Starting ('+unitW()+')</label><input type="number" step="any" id="gStart" value="'+fmtNum(dispW(g.startWeight),1)+'"></div>'+
   '<div class="field"><label>Current ('+unitW()+')</label><input type="number" step="any" id="gCur" value="'+fmtNum(dispW(g.currentWeight),1)+'"></div>'+
   '<div class="field"><label>Target ('+unitW()+')</label><input type="number" step="any" id="gTgt" value="'+fmtNum(dispW(g.targetWeight),1)+'"></div></div></div>'+
   '<div class="card" style="margin-top:14px"><h3>Nutrition</h3>'+
   '<div class="row"><div class="field"><label>Daily protein (g)</label><input type="number" id="gProt" value="'+g.protein+'"></div>'+
   '<div class="field"><label>Daily calories</label><input type="number" id="gCal" value="'+g.calories+'"></div></div>'+
   '<div class="row"><div class="field"><label>Daily water (L)</label><input type="number" step="any" id="gWater" value="'+g.water+'"></div>'+
   '<div class="field"><label>Daily creatine (g)</label><input type="number" step="any" id="gCreat" value="'+g.creatine+'"></div></div></div>'+
   '<div class="card" style="margin-top:14px"><h3>Recovery</h3>'+
   '<div class="row"><div class="field"><label>Sleep target (h)</label><input type="number" step="any" id="gSleep" value="'+g.sleep+'"></div>'+
   '<div class="field"><label>Minimum sleep (h)</label><input type="number" step="any" id="gMinSleep" value="'+g.minSleep+'"></div></div></div>'+
   '<div class="card" style="margin-top:14px"><h3>Training</h3>'+
   '<div class="row3"><div class="field"><label>Sessions / week</label><input type="number" id="gFreq" value="'+g.frequency+'"></div>'+
   '<div class="field"><label>Program duration (wks)</label><input type="number" id="gDur" value="'+g.duration+'"></div>'+
   '<div class="field"><label>Target RIR</label><input type="number" id="gTgtRir" value="'+g.targetRIR+'"></div></div></div>'+

 $("#saveGoals",host).addEventListener("click",()=>{
   g.startWeight=inW($("#gStart").value); g.currentWeight=inW($("#gCur").value); g.targetWeight=inW($("#gTgt").value);
   g.protein=num($("#gProt").value); g.calories=num($("#gCal").value); g.water=num($("#gWater").value); g.creatine=num($("#gCreat").value);
   g.sleep=num($("#gSleep").value); g.minSleep=num($("#gMinSleep").value);
   g.frequency=Math.round(num($("#gFreq").value))||3; g.duration=Math.round(num($("#gDur").value))||12; g.targetRIR=Math.round(num($("#gTgtRir").value));
