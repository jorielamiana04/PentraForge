 });
}
function setProgram(host){
 const p=S.program;
 host.innerHTML='<div class="card">'+
   '<div class="field"><label>Program name</label><input id="prName" value="'+esc(p.name)+'"></div>'+
   '<div class="field"><label>Description</label><textarea id="prDesc">'+esc(p.description)+'</textarea></div>'+
   '<div class="row3"><div class="field"><label>Duration (weeks)</label><input type="number" id="prDur" value="'+p.duration+'"></div>'+
   '<div class="field"><label>Frequency / week</label><input type="number" id="prFreq" value="'+p.frequency+'"></div>'+
   '<div class="field"><label>Current week</label><input type="number" id="prWeek" value="'+p.currentWeek+'"></div></div>'+
   '<div class="field"><label>Training days (comma-separated)</label><input id="prDays" value="'+esc(p.trainingDays.join(', '))+'"></div>'+
   '<button class="btn primary" id="savePr">Save program</button></div>'+
   '<div class="card" style="margin-top:14px"><h3>Phases</h3><div class="tablewrap" style="margin-top:8px"><table><thead><tr><th>Phase</th><th>Weeks</th><th>Focus</th><th>RIR</th></tr></thead><tbody>'+
   p.phases.map(ph=>'<tr><td>'+esc(ph.name)+'</td><td>'+esc(ph.weeks)+'</td><td>'+esc(ph.focus)+'</td><td>'+esc(ph.rir)+'</td></tr>').join('')+
   '</tbody></table></div><div class="hint">Imported from the source program. Edit training-day templates below.</div></div>'+
   '<div class="card" style="margin-top:14px"><h3>Day templates</h3><div id="tplList" style="margin-top:8px"></div></div>';
 $("#savePr",host).addEventListener("click",()=>{
   p.name=$("#prName").value.trim()||"12-Week Strength Program"; p.description=$("#prDesc").value;
   p.duration=Math.round(num($("#prDur").value))||12; p.frequency=Math.round(num($("#prFreq").value))||3;
   p.currentWeek=clamp(Math.round(num($("#prWeek").value))||1,1,999);
   p.trainingDays=$("#prDays").value.split(',').map(x=>x.trim()).filter(Boolean);
   S.goals.duration=p.duration; S.goals.frequency=p.frequency;
   save("program","goals"); refreshGreeting(); renderTemplates($("#tplList",host)); toast("Program saved.","good");
 });
 renderTemplates($("#tplList",host));
}
function renderTemplates(host){
 const p=S.program;
 host.innerHTML=sessionTypes().map(d=>{
   const list=p.split[d]||[];
   return '<div style="margin-bottom:12px"><div style="font-weight:700;margin-bottom:6px">'+esc(d)+'</div>'+
     '<div class="flexwrap">'+list.map(x=>'<span class="chip">'+esc(x)+' <button type="button" data-rmtpl="'+esc(d)+'|'+esc(x)+'" aria-label="Remove '+esc(x)+'" style="cursor:pointer;color:var(--bad);margin-left:4px;background:none;border:0;padding:0;font:inherit">×</button></span>').join('')+
     '<button class="chip" data-addtpl="'+esc(d)+'">+ add</button></div></div>';
 }).join('')||'<div class="sub">Add training days above to build templates.</div>';
 $$('[data-rmtpl]',host).forEach(b=>b.addEventListener("click",()=>{
   const [d,x]=b.dataset.rmtpl.split('|'); p.split[d]=(p.split[d]||[]).filter(e=>e!==x); save("program"); renderTemplates(host);
 }));
 $$('[data-addtpl]',host).forEach(b=>b.addEventListener("click",()=>{
   const d=b.dataset.addtpl;
   const opts=S.exercises.map(e=>'<button type="button" class="opt" data-pick="'+esc(e.name)+'" style="width:100%;text-align:left;margin-bottom:6px">'+esc(e.name)+'</button>').join('');
   const {ov,close}=openModal({title:"Add to "+d,body:'<div style="max-height:50vh;overflow:auto">'+opts+'</div>',foot:'<button class="btn ghost" data-x>Close</button>'});
   $$('[data-pick]',ov).forEach(o=>o.addEventListener("click",()=>{ p.split[d]=p.split[d]||[]; if(!p.split[d].includes(o.dataset.pick))p.split[d].push(o.dataset.pick); save("program"); close(); renderTemplates(host); }));
 }));
}
function setExercises(host){
 const render=()=>{
   let h='<div class="card"><div class="sec-head" style="margin-top:0"><h2 style="font-size:15px">Exercise library ('+S.exercises.length+')</h2><button class="btn primary sm" id="addExLib">'+ICON.plus+' Add</button></div>'+
     '<div class="hint" style="margin-bottom:12px">Add your own lifts — they appear in the workout picker and templates automatically. Deleting one never affects logged history.</div>'+
     '<input id="exLibSearch" aria-label="Search exercise library" placeholder="Search…" style="margin-bottom:12px"><div id="exLibList">';
   S.exercises.slice().sort((a,b)=>a.name.localeCompare(b.name)).forEach(e=>{
     h+='<div class="switch" data-exrow="'+esc(e.name.toLowerCase()+' '+(e.muscle||'').toLowerCase())+'"><div><div class="t">'+esc(e.name)+'</div><div class="d">'+esc(e.muscle||'—')+(e.pattern?' · '+esc(e.pattern):'')+(e.equipment?' · '+esc(e.equipment):'')+'</div></div><div class="flexwrap"><button class="btn ghost sm" data-editex="'+e.id+'">Edit</button><button class="btn danger sm" data-delex="'+e.id+'">Delete</button></div></div>';
   });
   h+='</div></div>';
   host.innerHTML=h;
   $("#addExLib",host).addEventListener("click",()=>editExercise(null,render));
   $("#exLibSearch",host).addEventListener("input",e=>{ const q=e.target.value.toLowerCase(); $$('[data-exrow]',host).forEach(r=>{ r.style.display=r.dataset.exrow.includes(q)?'':'none'; }); });
   $$('[data-editex]',host).forEach(b=>b.addEventListener("click",()=>editExercise(b.dataset.editex,render)));
   $$('[data-delex]',host).forEach(b=>b.addEventListener("click",()=>{ const ex=S.exercises.find(x=>x.id===b.dataset.delex); confirmModal("Delete exercise","Remove “"+(ex?ex.name:'')+"” from your library? Your logged history is not affected.",()=>{ S.exercises=S.exercises.filter(x=>x.id!==b.dataset.delex); save("exercises"); render(); toast("Exercise removed."); },true); }));
 };
 render();
}
function editExercise(id,after){
 const e=id?S.exercises.find(x=>x.id===id):{name:"",muscle:"Chest",secondary:"",pattern:"",equipment:"",reps:"",rir:""};
 openModal({title:id?"Edit exercise":"Add exercise",body:
   '<div class="field"><label>Name</label><input id="exN" value="'+esc(e.name)+'" placeholder="e.g. Incline Cable Fly"></div>'+
   '<div class="row"><div class="field"><label>Primary muscle</label><select id="exM">'+MUSCLES.map(m=>'<option'+(m===e.muscle?' selected':'')+'>'+esc(m)+'</option>').join('')+'</select></div>'+
   '<div class="field"><label>Movement pattern</label><input id="exP" value="'+esc(e.pattern||'')+'" placeholder="e.g. Horizontal Push"></div></div>'+
   '<div class="row3"><div class="field"><label>Equipment</label><input id="exE" value="'+esc(e.equipment||'')+'" placeholder="Barbell"></div>'+
   '<div class="field"><label>Rep range</label><input id="exR" value="'+esc(e.reps||'')+'" placeholder="8–12"></div>'+
   '<div class="field"><label>Target RIR</label><input id="exI" value="'+esc(e.rir||'')+'" placeholder="1–2"></div></div>',
   onOk:()=>{
     const name=$("#exN").value.trim(); if(!name){toast("Enter an exercise name.","bad");return false;}
     if(S.exercises.some(x=>x.name.toLowerCase()===name.toLowerCase() && x.id!==(id||''))){ toast("An exercise with that name already exists.","bad"); return false; }
     const data={name,muscle:$("#exM").value,pattern:$("#exP").value,equipment:$("#exE").value,reps:$("#exR").value,rir:$("#exI").value};
     if(id){ Object.assign(e,data); } else { S.exercises.push({id:uid(),secondary:"",...data}); }
     save("exercises"); if(after)after(); toast("Saved.","good");
   }});
}
function setInstall(host){
 const std=isStandalone(); const pf=platform();
 let h='<div class="card">';
 if(std){
   h+='<h3>Installed</h3><div class="sub">✓ You’re running '+esc(S.app.appName)+' as an installed app on this device. Your data is saved locally.</div>';
 } else {
   h+='<h3>Install as an app</h3><div class="sub" style="margin-bottom:12px">Add '+esc(S.app.appName)+' to your home screen to launch it full-screen like a native app. Everything stays on your device.</div>';
   if(pf==='ios'){
     h+='<ol class="small" style="line-height:1.9;padding-left:18px;margin:0 0 8px"><li>Open this page in <b>Safari</b> (not inside another app).</li><li>Tap the <b>Share</b> button (square with an ↑).</li><li>Scroll down, tap <b>Add to Home Screen</b>.</li><li>Tap <b>Add</b> — the icon appears on your home screen.</li></ol>'+
       '<div class="hint">Tip: open it from a link at least once; afterward it runs offline and remembers your data.</div>';
   } else {
     h+='<button class="btn primary block" id="pwaInstall"'+(deferredPrompt?'':' disabled')+'>Install app</button>'+
       '<div class="hint" style="margin-top:8px">'+(deferredPrompt?'Tap to install.':'If nothing happens, use your browser menu → “Install app” / “Add to Home screen”.')+'</div>';
   }
 }
 h+='</div>';
 h+='<div class="card" style="margin-top:14px"><h3>Where is my data?</h3><div class="sub">All data is stored locally on this device — nothing is uploaded anywhere. Use <b>Settings → Data → Export</b> to back it up, and <b>Import</b> to restore it or move to a new device.</div></div>';
 host.innerHTML=h;
 const ib=$('#pwaInstall',host);
 if(ib)ib.addEventListener('click',async()=>{
   if(!deferredPrompt){ toast("Use your browser menu to install.","bad"); return; }
   deferredPrompt.prompt(); try{ await deferredPrompt.userChoice; }catch(e){}
   deferredPrompt=null; ib.disabled=true;
 });
}
function setData(host){
 host.innerHTML='<div class="card"><h3>Backup & restore</h3><div class="sub" style="margin-bottom:12px">Export everything to a JSON file, or restore from a previous backup.</div>'+
   '<div class="flexwrap"><button class="btn primary" id="dExport">Export / Backup</button><button class="btn ghost" id="dImport">Import / Restore</button><input type="file" accept="application/json" id="dFile" hidden></div></div>'+
   '<div class="card" style="margin-top:14px"><h3 style="color:var(--bad)">Reset</h3><div class="sub" style="margin-bottom:12px">Destructive actions. Each asks for confirmation.</div>'+
   '<div class="flexwrap">'+

function exportData(){
 const payload={_meta:{app:S.app.appName,exportedAt:new Date().toISOString(),version:S.meta.version,generator:"Pentra Forge"}};
 SLICES.forEach(s=>payload[s]=S[s]);
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a"); a.href=url;
 const safe=(S.app.appName||"strength").replace(/[^a-z0-9]+/gi,'-').toLowerCase();
 a.download=safe+"-backup-"+todayISO()+".json"; a.click();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
 toast("Backup downloaded.","good");
}
function validateBackup(data){
 if(typeof data!=="object"||data===null||Array.isArray(data)) return {ok:false,errors:["File is not a valid backup object."]};
 const present=SLICES.filter(s=>data[s]!==undefined);
 if(!present.length) return {ok:false,errors:["No recognizable strength-system data found in this file."]};
 const errors=[];
 const arrays=["exercises","landmarks","strengthGoals","milestones","sessions","body","nutrition","recovery"];
 const objects=["meta","profile","app","settings","goals","program"];
 arrays.forEach(s=>{ if(data[s]!==undefined && !Array.isArray(data[s])) errors.push('"'+s+'" must be a list.'); });
 objects.forEach(s=>{ if(data[s]!==undefined && (typeof data[s]!=="object"||data[s]===null||Array.isArray(data[s]))) errors.push('"'+s+'" must be an object.'); });
 const ver=(data.meta&&data.meta.version)||1;
 return {ok:errors.length===0, errors, present, ver, newer:ver>SCHEMA_VERSION};
}
function importData(e){
 const f=e.target.files[0]; if(!f)return;
 const r=new FileReader();
 r.onload=()=>{
   let data;
   try{ data=JSON.parse(r.result); }
   catch(err){ toast("Import rejected — file is not valid JSON.","bad"); e.target.value=""; return; }
   const v=validateBackup(data);
   if(!v.ok){ toast("Import rejected: "+v.errors[0],"bad"); e.target.value=""; return; }
   const counts=[
     data.sessions?data.sessions.length+" sessions":null,
     data.body?data.body.length+" body entries":null,
     data.nutrition?data.nutrition.length+" nutrition days":null,
     data.recovery?data.recovery.length+" recovery logs":null,
     data.milestones?data.milestones.length+" milestones":null
   ].filter(Boolean).join(", ")||"settings & configuration";
   const warn=v.newer?'<div class="pill warn" style="margin-bottom:12px">Made by a newer version (schema '+esc(v.ver)+'). Some data may not load perfectly.</div>':'';
   openModal({title:"Restore backup",wide:false,
     body:warn+'<p style="margin:0;color:var(--muted)">This will <b>replace all current data</b> with the file’s contents:<br><br>'+esc(counts)+'.<br><br>This cannot be undone — export a backup first if unsure.</p>',
     foot:'<button class="btn ghost" data-x>Cancel</button><button class="btn danger" data-ok>Replace all data</button>',
     onOk:()=>{
       SLICES.forEach(s=>{ if(data[s]!==undefined)S[s]=data[s]; });
       migrate(S);
       S.meta.firstRun=false; saveAll(); applyBranding(); buildNav(); refreshGreeting(); location.hash="#/dashboard"; router();
       toast("Backup restored.","good");
     }});
   e.target.value="";
 };
 r.readAsText(f);
}

/* ============================================================================
   CHARTS — lightweight inline SVG
============================================================================ */
function lineChart(points,opts){
 opts=opts||{}; const W=320,H=opts.h||100,pad=opts.pad||{l:6,r:6,t:10,b:14};
 if(!points||points.length===0)return '<div class="sub">No data.</div>';
 if(points.length===1){ points=[{x:points[0].x-0.001,y:points[0].y},points[0]]; }
 const xs=points.map(p=>p.x),ys=points.map(p=>p.y);
 let minY=opts.min!=null?opts.min:Math.min(...ys), maxY=opts.max!=null?opts.max:Math.max(...ys);
 if(opts.goal!=null){ minY=Math.min(minY,opts.goal); maxY=Math.max(maxY,opts.goal); }
 if(minY===maxY){ maxY=minY+1; minY=minY-1; }
 const minX=Math.min(...xs),maxX=Math.max(...xs);
 const sx=x=>pad.l+(maxX===minX?0.5:(x-minX)/(maxX-minX))*(W-pad.l-pad.r);
 const sy=y=>H-pad.b-(y-minY)/(maxY-minY)*(H-pad.t-pad.b);
 let d=''; points.forEach((p,i)=>{ d+=(i?'L':'M')+round(sx(p.x),1)+' '+round(sy(p.y),1)+' '; });
 const area=d+'L'+round(sx(maxX),1)+' '+(H-pad.b)+' L'+round(sx(minX),1)+' '+(H-pad.b)+' Z';
 const gid='g'+(seq++);
 let svg='<svg aria-label="'+esc(opts.label||('Trend chart, '+points.length+' points'))+'" class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img">';
 svg+='<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity="0.28"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>';
 if(opts.goal!=null){ const gy=round(sy(opts.goal),1); svg+='<line x1="'+pad.l+'" y1="'+gy+'" x2="'+(W-pad.r)+'" y2="'+gy+'" stroke="var(--good)" stroke-width="1" stroke-dasharray="4 3" opacity="0.7"/>'; }
 svg+='<path d="'+area+'" fill="url(#'+gid+')"/>';
 svg+='<path d="'+d+'" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>';
 points.forEach(p=>{ svg+='<circle cx="'+round(sx(p.x),1)+'" cy="'+round(sy(p.y),1)+'" r="2.6" fill="var(--accent)"/>'; });
 svg+='</svg>';
 return svg;
}

    var d = Math.round((show(f, +last[f[0]]) - show(f, +c[f[0]])) * 10) / 10, good = d * dir(f); return '<span class="ms-d ' + (d === 0 || !dir(f) ? '' : good > 0 ? 'up' : 'down') + '">' + (d > 0 ? '+' : '') + fmtNum(d) + '</span>'; }
  function spark(vals){ if (vals.length < 2) return ''; var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals), rg = mx - mn || 1; return '<svg viewBox="0 0 60 20" class="bx-sp" aria-hidden="true"><polyline fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke" points="' + vals.map(function(v, i){ return (i * 60 / (vals.length - 1)).toFixed(1) + ',' + (18 - (v - mn) / rg * 16).toFixed(1); }).join(' ') + '"/></svg>'; }
  function changes(){ var out = F.map(function(f){ var rs = rows(f[0]); if (!rs.length) return ''; var last = rs[rs.length - 1];
      return '<button type="button" class="hs-ch bx-row" data-bx-chart="' + f[0] + '" aria-label="' + f[1] + ' chart"><b>' + f[1] + '</b><span class="num">' + fmtNum(Math.round(show(f, +last[f[0]]) * 10) / 10) + ' <small>' + esc(unit(f)) + '</small></span><span>' + delta(f, rs, 7) + '<small>7 days</small></span><span>' + delta(f, rs, 30) + '<small>30 days</small></span>' + spark(rs.slice(-8).map(function(r){ return show(f, +r[f[0]]); })) + '</button>'; }).join('');
    return '<section class="card ms-card" id="bxCard"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap"><h3 style="margin:0">Measurements</h3><button type="button" class="btn primary" data-bx-add>+ Add measurements</button></div>' + (out || '<p class="hint">No measurements yet. Add bodyweight, body fat and up to 9 tape measurements.</p>') + (out ? '<p class="hint">Green = moving toward your goal (bodyweight target ' + fmtNum(Math.round(dispW(+S.goals.targetWeight) * 10) / 10) + ' ' + esc(unitW()) + '; less body fat and waist; more chest, shoulders, arms and legs). Tap a row for its chart.</p>' : '') + '</section>'; }
  function sheet(html, label){ var ov = document.getElementById('lvSheet'); if (ov) ov.remove(); ov = document.createElement('div'); ov.id = 'lvSheet'; ov.className = 'lv-sheet'; ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true'); ov.setAttribute('aria-label', label); ov.innerHTML = '<div><div class="lv-grab"></div>' + html + '</div>'; document.body.appendChild(ov); ov.addEventListener('click', function(e){ if (e.target === ov) ov.remove(); }); return ov; }
  function add(){ var ov = sheet('<h2>Add measurements</h2><p class="hint">Fill in any you have \u2014 leave the rest empty. Measure in the morning, relaxed, same spots each time.</p><div class="tl-row"><label class="tl-f">Date<input class="lv-search" type="date" data-bx-date value="' + todayISO() + '"></label><span></span></div><div class="tl-row">' + F.map(function(f){ return '<label class="tl-f">' + f[1] + ' (' + esc(unit(f)) + ')<input class="lv-search" inputmode="decimal" data-bx="' + f[0] + '"></label>'; }).join('') + '</div><p class="hint" data-bx-err role="alert" style="color:var(--bad);min-height:1.2em"></p><button type="button" class="lv-add" data-bx-save style="border-style:solid;background:var(--accent);color:var(--accent-ink)">Save</button>', 'Add measurements');
    ov.querySelector('[data-bx]').focus();
    ov.addEventListener('click', function(e){ if (!e.target.closest('[data-bx-save]')) return; var rec = { id:uid(), week:S.program.currentWeek, date:ov.querySelector('[data-bx-date]').value || todayISO() }, n = 0, bad = '';
      F.forEach(function(f){ var raw = String(ov.querySelector('[data-bx="' + f[0] + '"]').value || '').replace(',', '.').trim(); if (!raw) return; var v = +raw; if (!(v > 0) || (f[2] === '%' && v > 70)) { bad = f[1]; return; } rec[f[0]] = Math.round(store(f, v) * 100) / 100; n++; });
      if (bad) { ov.querySelector('[data-bx-err]').textContent = 'Check ' + bad + '.'; return; } if (!n) { ov.querySelector('[data-bx-err]').textContent = 'Fill in at least one measurement.'; return; }
      S.body.push(rec); save('body'); ov.remove(); toast(n + ' measurement' + (n > 1 ? 's' : '') + ' saved.', 'good'); if (typeof router === 'function') router(); }); }
  function chart(k){ var f = F.filter(function(x){ return x[0] === k; })[0], rs = rows(k); if (!f || !rs.length) return; var t0 = t(rs[0].date), pts = rs.map(function(r){ return { x:(t(r.date) - t0) / DAY, y:show(f, +r[k]) }; });
    sheet('<h2>' + f[1] + '</h2><div role="img" data-bx-graph aria-label="' + f[1] + ': ' + rs.length + ' entries, from ' + fmtNum(Math.round(pts[0].y * 10) / 10) + ' to ' + fmtNum(Math.round(pts[pts.length - 1].y * 10) / 10) + ' ' + esc(unit(f)) + '">' + lineChart(pts, { h:150, unit:unit(f), label:f[1] + ' trend' }) + '</div>' + rs.slice().reverse().slice(0, 8).map(function(r){ return '<div class="ql-row"><b>' + esc(r.date) + '</b><small>' + fmtNum(Math.round(show(f, +r[k]) * 10) / 10) + ' ' + esc(unit(f)) + '</small></div>'; }).join(''), f[1] + ' chart'); }
  document.addEventListener('click', function(e){ if (e.target.closest('[data-bx-add]')) { add(); return; } var c = e.target.closest('[data-bx-chart]'); if (c) chart(c.getAttribute('data-bx-chart')); });
  return { changes:changes, add:add, chart:chart, F:F };
})();

/* ===== Lazy sections (Oct 2026): in the hosted app, rarely used sections (Admin, Tools, Guides, Library, Plan builder) live in extras.js
   and load on first use (cached for offline). In the single offline file everything is already here, so this does nothing. ===== */
var Extras = (function(){
  var p = null, IDS = [['tools', 'Tools'], ['guides', 'Guides'], ['library', 'Library'], ['plan', 'Plan builder'], ['league', 'Leaderboard'], ['report', 'Season report']];
  function loaded(){ return typeof Tools !== 'undefined' && typeof League !== 'undefined' && typeof Report !== 'undefined'; }
  function load(){ if (loaded()) return Promise.resolve(); return p || (p = new Promise(function(res, rej){ var s = document.createElement('script'); s.src = 'extras.js'; s.onload = function(){ if (window.Admin) Admin.init(); res(); };
    s.onerror = function(){ p = null; s.remove(); rej(new Error('Could not load this section. Check your connection and try again.')); }; document.head.appendChild(s); })); }
  function stub(id, label){ return { id:id, label:label, icon:(typeof ICON !== 'undefined' && (ICON.goals || ICON.volume)) || '', _stub:1, render:function(v){ v.innerHTML = '<div class="page-head"><h1>' + esc(label) + '</h1></div><p class="hint" role="status">Loading\u2026</p>';
    load().then(function(){ var r = ROUTES.filter(function(x){ return x.id === id; })[0]; if (r && !r._stub && currentRoute() === id) router(); }).catch(function(e){ v.innerHTML = '<div class="page-head"><h1>' + esc(label) + '</h1></div><p class="hint" role="alert">' + esc(e.message) + '</p>'; }); } }; }
  if (!loaded()) IDS.forEach(function(x){ if (!ROUTES.some(function(r){ return r.id === x[0]; })) ROUTES.push(stub(x[0], x[1])); });
  function init(){ if (!loaded() && !ROUTES.some(function(r){ return r.id === 'admin'; })) ROUTES.push(stub('admin', 'Admin')); }
  return { load:load, init:init, loaded:loaded };
})();
function registerRoute(def){ var r = ROUTES.filter(function(x){ return x.id === def.id; })[0]; if (r) { r.render = def.render; r.label = def.label; delete r._stub; } else ROUTES.push(def); }   /* replaces a lazy stub, or adds the route */
/* Dashboard: deload-week note; Workout: link to the Plan builder (core, so they work before extras load) */
(function(){ var d = ROUTES.filter(function(r){ return r.id === 'dashboard'; })[0], w = ROUTES.filter(function(r){ return r.id === 'workout'; })[0];
  if (d && !d._dl) { var o1 = d.render; d.render = function(v){ o1(v); var dl = (S.program.deloadWeeks || []).indexOf(+S.program.currentWeek) >= 0, h = v.querySelector('.hero-start'); if (dl && h) h.insertAdjacentHTML('afterend', '<section class="card ms-card pb-deload" role="note"><h3>Deload week</h3><p class="hint" style="margin:0">Same weights, about 40% fewer sets — the workout plans them for you. Recover now, come back stronger.</p></section>'); }; d._dl = 1; }
  if (w && !w._pb) { var o2 = w.render; w.render = function(v){ o2(v); var h = v.querySelector('.ql-open') || v.querySelector('.hero-start'); if (h) h.insertAdjacentHTML('afterend', '<a class="card rk-dash" href="#/plan"><span><small class="hint" style="margin:0">PLAN BUILDER</small><b>Build a plan for your week</b><small class="hint" style="margin:0">Goal, days, equipment, experience — sessions and weeks</small></span><span aria-hidden="true">›</span></a>'); }; w._pb = 1; } })();
/* Progress: link to the season report (core, works before extras load) */
(function(){ var p = ROUTES.filter(function(r){ return r.id === 'progress'; })[0]; if (!p || p._rp) return; var o = p.render; p.render = function(v){ o(v); var h = v.querySelector('.page-head'); if (h) h.insertAdjacentHTML('afterend', '<a class="card rk-dash" href="#/report"><span><small class="hint" style="margin:0">SEASON REPORT</small><b>Your block on one page</b><small class="hint" style="margin:0">Print it or save it as a PDF</small></span><span aria-hidden="true">\u203A</span></a>'); }; p._rp = 1; })();

boot(); NeonTheme.migrate(); NeonTheme.inject(); MobileNav.init(); Live.init(); window.Admin && Admin.init(); Extras.init(); Cloud.init(); Game.init();
</script>
